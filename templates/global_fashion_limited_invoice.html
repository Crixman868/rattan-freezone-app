<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
    <style>
        .stamp-wrapper {
            position: relative;
            width: 400px;
            height: 220px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* VIOLET STAMP DESIGN */
        .hk-garment-chop {
            width: 240px;
            height: 120px;
            border: 3px solid #4B0082;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4B0082;
            font-family: 'Arial', sans-serif;
            text-align: center;
            transform: rotate(2deg);
            padding: 5px;
            box-shadow: 0 0 0 1px #4B0082 inset, 0 0 0 3px white inset, 0 0 0 4px #4B0082 inset;
        }
        .chop-en-top { font-size: 12px; font-weight: 900; letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; }
        .chop-cn-mid { 
            font-size: 20px; 
            font-weight: bold; 
            letter-spacing: 6px; 
            border-top: 1px dashed #4B0082; 
            border-bottom: 1px dashed #4B0082; 
            padding: 6px 15px; 
            margin-bottom: 5px; 
        }
        .chop-en-bot { font-size: 9px; font-weight: bold; letter-spacing: 1.5px; }
        
        /* ADJUSTED SIGNATURE OVERLAY (REDUCED SIZE) */
        .auth-signature {
            position: absolute;
            top: 40px; /* Adjusted downward to center the smaller text */
            left: 60px; /* Pushed right to center within the wrapper */
            font-family: 'Mrs Saint Delafield', cursive;
            font-size: 75px; /* Reduced to provide realistic proportion against the stamp */
            color: #0033aa; /* Realistic blue pen ink */
            transform: rotate(-9deg);
            z-index: 10;
            white-space: nowrap; 
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>
    <div class="stamp-wrapper">
        <div class="hk-garment-chop">
            <div class="chop-en-top">Global Fashion Limited</div>
            <div class="chop-cn-mid">環球服裝有限公司</div>
            <div class="chop-en-bot">KOWLOON • HONG KONG</div>
        </div>
        <div class="auth-signature">Vincent Leung</div>
    </div>
</body>
</html>
