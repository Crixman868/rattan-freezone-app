<!DOCTYPE html>
<html>
<head>
    <style>
        @page { size: letter {{ orientation }}; margin: 0.35in; }
        body { font-family: sans-serif; font-size: 11px; color: #111; line-height: 1.3; }
        .header-master { border-bottom: 2px solid {{ primary_hex }}; padding-bottom: 10px; margin-bottom: 15px; }
        .logo { max-height: 40px; }
        .signature { max-height: 80px; }
        .signature-frame { height: 80px; border-bottom: 1px solid #111; width: 200px; margin-top: 10px; }
        table { border-collapse: collapse; width: 100%; }
        th { background-color: {{ primary_hex }}; color: #fff; padding: 6px; }
        td { padding: 6px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <table class="header-master" width="100%">
        <tr>
            <td><img src="{{ logo_path }}" class="logo"></td>
            <td align="right">
                <h2 style="color: {{ primary_hex }};">CARICOM INVOICE</h2>
                <p>Cert ID: {{ inv_no }}-{{ date }}</p>
            </td>
        </tr>
    </table>
    <h3>Exporter: {{ supplier_name }}</h3>
    <p>{{ supplier_address }}</p>
    <table>
        <tr><th>Description</th><th>Qty</th><th>Total</th></tr>
        <tr><td>{{ additional_notes }}</td><td>-</td><td>${{ subtotal }}</td></tr>
    </table>
    <div align="right">
        <div class="signature-frame">
            {% if sig_path %} <img src="{{ sig_path }}" class="signature"> {% endif %}
        </div>
        <b>{{ signatory_position }}</b>
    </div>
</body>
</html>
